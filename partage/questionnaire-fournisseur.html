<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SILENCE — Supplier Qualification</title>
<style>html{background:#0B0B0C}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
  :root{
    color-scheme: dark;
    --noir:#0B0B0C; --surface:#131318; --surface2:#1a1a21;
    --line:#26262f; --line2:#33333f;
    --ivoire:#F4F2ED; --chrome:#B8BEC8; --mute:#7E7E8A;
    --ambre:#E0A458; --ambre-dim:#8a6534;
    --nuit:#16324F; --rouge:#E4796C;
    --noto:'Noto Sans Arabic','Noto Sans JP','Noto Sans SC','PingFang SC',
           'Hiragino Sans','Microsoft YaHei','Segoe UI',Tahoma;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,var(--noto),sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,var(--noto),monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--noir); color:var(--ivoire);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    padding-block:0; padding-inline:16px;
  }
  .wrap{max-width:760px;margin:0 auto;padding-block:26px 80px}

  .langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:26px}
  .langs button{
    font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.08em;cursor:pointer;
    background:transparent;color:var(--mute);border:1px solid var(--line2);
    border-radius:5px;padding:8px 13px;min-height:40px;
  }
  .langs button:hover{color:var(--ivoire);border-color:var(--chrome)}
  .langs button[aria-pressed="true"]{background:var(--ivoire);color:var(--noir);border-color:var(--ivoire);font-weight:700}
  .langs button:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ambre);margin:0 0 14px}
  h1{font-size:clamp(34px,7vw,52px);font-weight:600;letter-spacing:.3em;text-indent:.3em;margin:0 0 20px;line-height:1.05;text-wrap:balance}
  .lede{max-width:60ch;color:var(--chrome);font-size:16px;margin:0 0 6px}
  .lede strong{color:var(--ivoire);font-weight:600}

  .warn{
    margin:28px 0 0;padding:18px 20px;border-radius:10px;
    border:1px solid var(--ambre-dim);background:rgba(224,164,88,.07);
    font-size:15px;color:var(--ivoire);
  }
  .warn p{margin:0}
  .warn .ask{font-size:16.5px;font-weight:600;color:var(--ivoire)}
  .warn strong{color:var(--ambre)}

  .status{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    margin:32px -16px 0;padding:14px 16px;
    background:var(--surface);border-block:1px solid var(--line);
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  }
  .badge{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.12em;padding:7px 14px;border-radius:5px}
  .badge.ok{background:var(--ambre);color:var(--noir)}
  .badge.ko{background:var(--rouge);color:var(--noir)}
  .badge.wait{background:var(--surface2);color:var(--mute);border:1px solid var(--line2)}
  .tally{font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .tally b{color:var(--ivoire)}

  h2{font-size:12px;font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ambre);
     margin:56px 0 6px;font-weight:500}
  .h2sub{color:var(--mute);font-size:14px;margin:0 0 22px}
  .h2sub strong{color:var(--ivoire);font-weight:600}

  .q{border:1px solid var(--line);border-radius:10px;background:var(--surface);
     padding:18px;display:grid;grid-template-columns:34px 1fr;gap:4px 14px;align-items:start;margin-bottom:10px;
     transition:border-color .15s,background .15s}
  .q[data-a="no"]{border-color:var(--rouge);background:rgba(228,121,108,.07)}
  .q[data-a="yes"]{border-color:var(--ambre-dim)}
  .num{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:3px;font-variant-numeric:tabular-nums}
  .qt{font-size:15.5px;font-weight:500;margin:0}
  .qd{grid-column:2;color:var(--chrome);font-size:13.5px;margin:4px 0 0}
  .opt{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .opt button{
    font:inherit;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.1em;
    cursor:pointer;padding:9px 20px;border-radius:5px;min-height:44px;min-width:76px;
    background:transparent;color:var(--mute);border:1px solid var(--line2);
  }
  .opt button:hover{color:var(--ivoire);border-color:var(--chrome)}
  .opt button:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
  .q[data-a="yes"] .y{background:var(--ambre);color:var(--noir);border-color:var(--ambre)}
  .q[data-a="no"] .n{background:var(--rouge);color:var(--noir);border-color:var(--rouge)}

  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:660px}
  th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:13.5px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500}
  tr:last-child td{border-bottom:none}
  td:first-child{font-weight:500}
  .spec{font-family:var(--mono);color:var(--ambre);white-space:nowrap}
  input{
    font:inherit;font-family:var(--mono);font-size:13px;width:100%;min-width:84px;
    background:var(--noir);color:var(--ivoire);border:1px solid var(--line2);
    border-radius:5px;padding:9px 10px;min-height:42px;
  }
  input::placeholder{color:#55555f}
  input:focus{outline:2px solid var(--ambre);outline-offset:1px;border-color:var(--ambre)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .field{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px}
  .field label{display:block;font-size:13.5px;margin-bottom:9px;color:var(--ivoire)}
  .field .unit{color:var(--mute)}
  .field .hint{display:block;color:var(--mute);font-size:12px;margin-top:7px}

  .out{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
  .outhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    padding:13px 16px;border-bottom:1px solid var(--line)}
  .outhead span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .copy{font:inherit;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.09em;cursor:pointer;
    background:var(--ambre);color:var(--noir);border:none;border-radius:5px;padding:10px 18px;min-height:44px}
  .copy:focus-visible{outline:2px solid var(--ivoire);outline-offset:2px}
  pre{margin:0;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.7;text-align:left;
    color:var(--chrome);white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto}

  footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);
    color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 20px}
  footer b{color:var(--chrome);font-weight:500}

  /* L'arabe et le japonais : pas de majuscules forcées, pas de lettres espacées */
  .wrap[data-script="wide"] .eyebrow,
  .wrap[data-script="wide"] h2,
  .wrap[data-script="wide"] th,
  .wrap[data-script="wide"] .badge,
  .wrap[data-script="wide"] .opt button,
  .wrap[data-script="wide"] .copy,
  .wrap[data-script="wide"] .outhead span{
    font-family:var(--sans);letter-spacing:normal;text-transform:none;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="wrap">

  <div class="langs" dir="ltr">
    <button type="button" data-l="fr">FRANÇAIS</button>
    <button type="button" data-l="en">ENGLISH</button>
    <button type="button" data-l="ar">العربية</button>
    <button type="button" data-l="ja">日本語</button>
    <button type="button" data-l="zh">中文</button>
  </div>

  <p class="eyebrow" id="eyebrow"></p>
  <h1 dir="ltr">SILENCE</h1>
  <p class="lede" id="lede1"></p>
  <div class="warn"><p class="ask" id="ask"></p></div>

  <div class="status">
    <span class="badge wait" id="badge"></span>
    <span class="tally" id="tally"></span>
  </div>

  <h2 id="t1"></h2>
  <p class="h2sub" id="s1"></p>
  <div id="qs"></div>

  <h2 id="t4"></h2>
  <p class="h2sub" id="s4"></p>
  <div class="out">
    <div class="outhead">
      <span id="stamp"></span>
      <button class="copy" id="copybtn" type="button"></button>
    </div>
    <pre id="output" dir="ltr"></pre>
  </div>

  <footer>
    <span><b>SILENCE</b> — <span id="foot"></span></span>
    <span dir="ltr">astralzayte@gmail.com</span>
  </footer>
</div>

/* Nos conditions : les mêmes chiffres dans toutes les langues */
const SPECS = [["200 gsm","0.25 kg","2.50 USD"],["320 gsm","1.00 kg","3.00 USD"],
  ["nylon","0.60 kg","3.00 USD"],["300 gsm","0.60 kg","5.80 USD"],
  ["—","0.90 kg","6.20 USD"],["320 gsm","1.60 kg","8.80 USD"]];

const answers = {};
let lang = "fr";
const $ = id => document.getElementById(id);

function build() {
  const t = L[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  const wrap = $("wrap");
  wrap.dir = t.rtl ? "rtl" : "ltr";
  if (t.wide) wrap.dataset.script = "wide"; else delete wrap.dataset.script;

  $("eyebrow").textContent = t.eyebrow;
  $("lede1").innerHTML = t.lede1;
  $("ask").textContent = t.ask;
  $("t1").textContent = t.t1; $("s1").textContent = t.s1;
  $("t4").textContent = t.t4; $("s4").textContent = t.s4;
  $("stamp").textContent = t.stamp;
  $("copybtn").textContent = t.copy;
  $("foot").textContent = t.foot;
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.l === lang ? "true" : "false"));

  const qs = $("qs"); qs.innerHTML = "";
  t.q.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "q";
    if (answers[i]) card.dataset.a = answers[i];
    card.innerHTML =
      '<div class="num" dir="ltr">' + String(i + 1).padStart(2, "0") + '</div>' +
      '<p class="qt"></p><p class="qd"></p>' +
      '<div class="opt"><button type="button" class="y" data-v="yes"></button>' +
      '<button type="button" class="n" data-v="no"></button></div>';
    card.querySelector(".qt").textContent = q[0];
    card.querySelector(".qd").textContent = q[1];
    card.querySelector(".y").textContent = t.yes;
    card.querySelector(".n").textContent = t.no;
    card.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      answers[i] = b.dataset.v; card.dataset.a = b.dataset.v; refresh();
    }));
    qs.appendChild(card);
  });

  refresh();
}

function val(id) { const e = $(id); return e && e.value.trim() ? e.value.trim() : "—"; }

function refresh() {
  const t = L[lang], n = t.q.length;
  const done = Object.keys(answers).length;
  let fails = 0;
  for (let i = 0; i < n; i++) if (answers[i] === "no") fails++;

  const badge = $("badge");
  $("tally").innerHTML = t.tally(done, n, fails);
  if (fails > 0) { badge.className = "badge ko"; badge.textContent = t.ko; }
  else if (done === n) { badge.className = "badge ok"; badge.textContent = t.ok; }
  else { badge.className = "badge wait"; badge.textContent = done === 0 ? t.wait : t.prog; }

  /* Le bloc à renvoyer reste en anglais, quelle que soit la langue choisie */
  const E = L.en, o = [];
  o.push("SILENCE — SUPPLIER QUALIFICATION");
  o.push(E.lbl.answered + ": " + done + "/" + n + "   " + E.lbl.failed + ": " + fails);
  o.push("");
  o.push(E.lbl.cond);
  E.q.forEach((q, i) => {
    const a = answers[i] ? (answers[i] === "yes" ? "YES " : "NO  ") : "—   ";
    o.push(String(i + 1).padStart(2, "0") + "  " + a + "  " + q[0]);
  });
  $("output").textContent = o.join("\n");
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => { lang = b.dataset.l; build(); }));

$("copybtn").addEventListener("click", () => {
  const t = L[lang], btn = $("copybtn"), txt = $("output").textContent;
  const done = () => { btn.textContent = t.copied; setTimeout(() => btn.textContent = t.copy, 1800); };
  const select = () => {
    const r = document.createRange();
    r.selectNodeContents($("output"));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = t.sel;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(select);
  } else select();
});

build();
</script>
