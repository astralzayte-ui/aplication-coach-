[build]
  publish = "."

# Le coffre (netlify/functions/vault.mjs) dépend de @netlify/blobs, qui exige Node 22.12+.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# La page est tout le programme : on la revalide à chaque ouverture pour
# qu'une mise à jour soit visible tout de suite au lieu d'attendre une heure.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
