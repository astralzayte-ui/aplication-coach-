[build]
  # Ne publier que l'application. Sans ça, Netlify mettait en ligne tout le dépôt :
  # les ~2 800 fichiers de paquets installés pour le coffre, et les notes de travail.
  # Une autre app se range dans apps/<nom>/index.html et sort à /<nom>/.
  command = "rm -rf _site && mkdir -p _site && cp index.html _site/ && if [ -d apps ]; then cp -R apps/. _site/; fi"
  publish = "_site"

# Le coffre (netlify/functions/vault.mjs) dépend de @netlify/blobs, qui exige Node 22.12+.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# La page est tout le programme : on la revalide à chaque ouverture pour
# qu'une mise à jour soit visible tout de suite au lieu d'attendre une heure.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
