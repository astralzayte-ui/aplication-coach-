<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Aurel</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a0a0d">
  <!-- <base href="/"> : la page 404 peut s'afficher à n'importe quelle adresse (ex. /a/b/c).
       Tous les liens relatifs (menu compris) partent alors de la racine du site. -->
  <base href="/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="404">
  <header id="entete" class="entete"></header>

  <main id="contenu" class="conteneur page-404">
    <div>
      <div id="montre-404"></div>
      <p class="surtitre">Erreur 404</p>
      <h1>Cette page n'est pas à l'heure</h1>
      <p class="texte-doux">La page que vous cherchez n'existe pas ou a été déplacée.</p>
      <a class="btn btn-or" href="index.html">Retour à l'accueil</a>
    </div>
  </main>

  <footer id="pied" class="pied"></footer>

  <script src="js/config.js"></script>
  <script src="js/produits.js"></script>
  <script src="js/montre-svg.js"></script>
  <script src="js/panier.js"></script>
  <script src="js/commun.js"></script>
  <script>
    // Une montre pour illustrer la page d'erreur.
    document.getElementById('montre-404').innerHTML = dessinerMontre(trouverProduit('medina-classique'));
  </script>
</body>
</html>
